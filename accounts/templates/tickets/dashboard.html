
{% load static %}

<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Управление заявками</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css"
    >
</head>

<body>
    <div class="page">
        <div class="page-wrapper">
            <div class="container-xl py-4">

                <h1 class="mb-4">Центр управления заявками</h1>

                {% csrf_token %}

                <div
                    id="message"
                    role="status"
                    aria-live="polite"
                ></div>

                <div class="card mb-4">
                    <div class="card-body">

                        <form id="ticket-form">

                            <div class="mb-3">
                                <label class="form-label">
                                    Название заявки
                                </label>

                                <input
                                    id="title"
                                    class="form-control"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Категория
                                </label>

                                <select
                                    id="category"
                                    class="form-select"
                                    required
                                ></select>
                            </div>

                            <button
                                class="btn btn-primary"
                                type="submit"
                            >
                                Создать заявку
                            </button>

                        </form>

                    </div>
                </div>

                <div class="card">

                    <div class="card-header">
                        <h2 class="card-title">
                            Список заявок
                        </h2>
                    </div>

                    <div class="card-body">

                        <select
                            id="status-filter"
                            class="form-select mb-3"
                        >
                            <option value="">Все статусы</option>
                            <option value="new">Новые</option>
                            <option value="progress">В работе</option>
                            <option value="done">Выполненные</option>
                        </select>

                        <div id="loading" hidden>
                            Загрузка данных...
                        </div>

                        <div id="tickets-list"></div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <div class="modal" id="status-modal" tabindex='-1'>
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Изменение статуса заявки</h5>
                </div>
                <div class="modal-body">
                    <label class="form-label" for="new-status">Новый статус</label>
                    <select id="new-status" class="form-select">
                        <option value="new">Новая</option>
                        <option value="progress">В работе</option>
                        <option value="done">Выполнена</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" data-bs-dismiss="modal" class="btn btn-secondary">Отмена</button>
                    <button type="button" id="save-status" class="btn btn-primary">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'tickets/app.js' %}"></script>
</body>
</html>
